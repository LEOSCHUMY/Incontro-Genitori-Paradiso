<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iscriviti al Calendario Eventi</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border-color: #e2e8f0;
      --accent-color: #2563eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    .icon-container {
      width: 64px;
      height: 64px;
      background-color: #eff6ff;
      color: var(--accent-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem auto;
    }

    .icon-container svg {
      width: 32px;
      height: 32px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    p.description {
      color: var(--text-sub);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 0.85rem 1.25rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      border: 1px solid var(--border-color);
      background-color: #ffffff;
      color: var(--text-main);
    }

    .btn:hover {
      background-color: #f1f5f9;
      transform: translateY(-1px);
    }

    .btn-recommended {
      background-color: var(--accent-color);
      color: #ffffff;
      border-color: var(--accent-color);
    }

    .btn-recommended:hover {
      background-color: #1d4ed8;
    }

    .badge {
      font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.25);
      padding: 2px 8px;
      border-radius: 12px;
      margin-left: auto;
    }

    .footer-note {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon-container">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 002-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
      </svg>
    </div>

    <h1>Calendario Eventi</h1>
    <p class="description">Iscriviti per sincronizzare automaticamente tutti gli eventi aggiornati direttamente sul tuo dispositivo.</p>

    <div class="btn-container">
      <!-- Apple Calendar (iOS / macOS) -->
      <a id="btn-apple" class="btn" href="webcal://calendar.google.com/calendar/ical/15d081e0c267fadb3c325c05f3971cd551653d21289f9e2d268436b63d33cc32%40group.calendar.google.com/public/basic.ics">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.85c.66-.8 1.11-1.92.99-3.04-.96.04-2.12.64-2.81 1.44-.61.71-1.14 1.86-.99 2.96 1.07.08 2.15-.56 2.81-1.36z"/></svg>
        Apple Calendar (iOS / Mac)
      </a>

      <!-- Google Calendar -->
      <a id="btn-google" class="btn" href="https://calendar.google.com/calendar/render?cid=https%3A%2F%2Fcalendar.google.com%2Fcalendar%2Fical%2F15d081e0c267fadb3c325c05f3971cd551653d21289f9e2d268436b63d33cc32%2540group.calendar.google.com%2Fpublic%2Fbasic.ics" target="_blank" rel="noopener">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M21.35 11.1h-9.17v2.73h6.51c-.33 1.76-1.82 3.08-3.78 3.08-2.27 0-4.11-1.84-4.11-4.11s1.84-4.11 4.11-4.11c1.02 0 1.95.38 2.67 1.01l2.06-2.06C18.35 6.35 16.23 5.5 13.9 5.5c-3.87 0-7 3.13-7 7s3.13 7 7 7c4.04 0 6.72-2.84 6.72-6.84 0-.52-.05-.98-.12-1.4-.15-.16-.15-.16-.15-.16z"/></svg>
        Google Calendar
      </a>

      <!-- Outlook Web -->
      <a id="btn-outlook" class="btn" href="https://outlook.live.com/calendar/0/addcalendar?url=https%3A%2F%2Fcalendar.google.com%2Fcalendar%2Fical%2F15d081e0c267fadb3c325c05f3971cd551653d21289f9e2d268436b63d33cc32%2540group.calendar.google.com%2Fpublic%2Fbasic.ics" target="_blank" rel="noopener">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M21.5 3h-19C1.67 3 1 3.67 1 4.5v15c0 .83.67 1.5 1.5 1.5h19c.83 0 1.5-.67 1.5-1.5v-15c0-.83-.67-1.5-1.5-1.5zm-10 13H4v-8h7.5v8zm0-9.5H4V5h7.5v1.5zm8.5 9.5h-7v-3.5h7V16zm0-5h-7V7.5h7V11z"/></svg>
        Outlook / Microsoft 365
      </a>

      <!-- Direct ICS Download -->
      <a class="btn" href="https://calendar.google.com/calendar/ical/15d081e0c267fadb3c325c05f3971cd551653d21289f9e2d268436b63d33cc32%40group.calendar.google.com/public/basic.ics" download>
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
        Scarica file .ICS (Generico)
      </a>
    </div>

    <p class="footer-note">Gli eventi aggiunti tramite sottoscrizione si aggiorneranno automaticamente.</p>
  </div>

  <script>
    // Rileva il sistema operativo e imposta il pulsante primario consigliato
    document.addEventListener("DOMContentLoaded", function() {
      const userAgent = navigator.userAgent || navigator.vendor || window.opera;
      const isApple = /iPad|iPhone|iPod|Macintosh/i.test(userAgent) && !window.MSStream;
      const isAndroid = /android/i.test(userAgent);

      if (isApple) {
        const btnApple = document.getElementById('btn-apple');
        btnApple.classList.add('btn-recommended');
        btnApple.insertAdjacentHTML('beforeend', '<span class="badge">Consigliato</span>');
      } else if (isAndroid) {
        const btnGoogle = document.getElementById('btn-google');
        btnGoogle.classList.add('btn-recommended');
        btnGoogle.insertAdjacentHTML('beforeend', '<span class="badge">Consigliato</span>');
      }
    });
  </script>

</body>
</html>
